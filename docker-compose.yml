# H7.1 · D1 — المنظومة كاملة محليًا: قاعدة + هجرات + بيانات تجريبية + API
# + بروكسي يخدم الواجهة. **للتطوير و CI فقط** — compose الإنتاج في D2.
#
#   JWT_SECRET=$(node -e "console.log(require('crypto').randomBytes(32).toString('hex'))") \
#     docker compose up --build -d
#
# ثم افتح https://localhost (شهادة محلية موقّعة ذاتيًا ⇒ تحذير المتصفح متوقّع)
# واختبار الدخان: bash scripts/docker-smoke-test.sh
services:
  db:
    image: postgres:16
    container_name: tender_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: tender_dev
    ports:
      - '5432:5432'
    volumes:
      - tender_pgdata:/var/lib/postgresql/data
    # الفحص شرطٌ لإقلاع الهجرات: postgres يقبل الاتصالات بعد ثوانٍ من بدء الحاوية
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d tender_dev']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  # الهجرات كخطوة نشر منفصلة تعمل **مرة واحدة**، لا عند إقلاع كل نسخة:
  # نسخ متوازية تتسابق على نفس الهجرة. تُبنى من مرحلة `build` لأن أداة prisma
  # تطويرية فلا وجود لها في صورة التشغيل.
  migrate:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    container_name: tender_migrate
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tender_dev
    # مباشرةً لا عبر `pnpm exec` — لنفس سبب خطوة generate في الـDockerfile:
    # فحص pnpm 11 لتطابق node_modules يحاول تثبيتًا ثم يسقط بلا TTY.
    command: /app/apps/api/node_modules/.bin/prisma migrate deploy --schema /app/apps/api/prisma/schema.prisma
    restart: 'no'

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    image: tender-api
    container_name: tender_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tender_dev
      # H7.3 — لا سرّ مخبوز في الملف ولا قيمة افتراضية: الإقلاع يفشل برسالة
      # واضحة إن لم يُمرَّر السرّ من البيئة.
      JWT_SECRET: ${JWT_SECRET:?required — export JWT_SECRET before running docker compose}
      NODE_ENV: production
      PORT: 4000
      # D1 — أصل واحد: أصل الواجهة هو أصل الـAPI نفسه
      WEB_ORIGIN: ${SITE_URL:-https://localhost}
      # D1 — صار أمام الحاوية بروكسي واحد (Caddy)، فقفزة واحدة موثوقة (H0.2)
      TRUST_PROXY: 1
    # D1 — **لا منفذ منشور**: كل شيء يمرّ من البروكسي. نشر 4000 هنا يخلق
    # أصلًا ثانيًا يلتفّ على البروكسي فيخفي أعطال المسارات والكوكي.
    expose:
      - '4000'
    volumes:
      # المرفقات خارج طبقة الحاوية حتى تبقى بعد إعادة البناء
      - tender_uploads:/app/uploads

  # بيانات تجريبية — للتطوير و CI فقط، ولا وجود لها في compose الإنتاج (D2).
  # لازمة لفحص دورة تسجيل الدخول في اختبار الدخان (D1.4).
  seed:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
      target: build
    container_name: tender_seed
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/tender_dev
    # مباشرةً لا عبر `pnpm exec` — فحص pnpm 11 لتطابق node_modules يسقط بلا TTY
    working_dir: /app/apps/api
    command: ./node_modules/.bin/tsx prisma/seed.ts
    restart: 'no'

  # D1 — البروكسي العكسي: يخدم الواجهة ويمرّر /api إلى الـAPI بأصل واحد
  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    image: tender-web
    container_name: tender_web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-localhost}
    # المنافذ المحجوزة على المضيف ⇒ غير المحجوزة في الحاوية (مستخدم غير جذر)
    ports:
      - '80:8080'
      - '443:8443'
    volumes:
      # شهادات Caddy المحلية تبقى بين عمليات الإقلاع فلا تُصدَر من جديد
      - tender_caddy_data:/data

volumes:
  tender_pgdata:
  tender_uploads:
  tender_caddy_data:
