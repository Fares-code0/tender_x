# D2 — مخطّط نشر Render (Blueprint).
#
# **الأصل الواحد محفوظ كما هو**: خدمة واحدة عامّة (Caddy) هي الباب الوحيد،
# والـAPI خدمة **خاصّة** لا عنوان عام لها، والقاعدة داخلية. هذا هو نفس شكل
# `docker-compose.prod.yml` مترجَمًا إلى مفردات Render، لا معمارية جديدة.
#
# لماذا Render بدل خادم مملوك: يحفظ الأصل الواحد ويُسقط عبء صيانة الخادم
# (نظام التشغيل، الشهادات، النسخ الاحتياطي) — وهو ما يناسب نشرًا للعرض.
#
# ⚠️ **الصور خاصّة على GHCR.** أضف بيانات اعتماد سجلّ باسم `ghcr` في
# Render (Settings → Registry Credentials) قبل أول مزامنة، وإلا فشل السحب.
#
# ⚠️ **الوسم صريح ولا `latest`.** الترقية = تغيير الوسم هنا ثم مزامنة
# المخطّط. والتراجع = إعادته إلى وسم أقدم. هذا مقصود: خادم يسحب `latest`
# لا يمكن لأحد أن يقول ما الذي يعمل عليه.

databases:
  - name: tender-db
    databaseName: tender
    user: tender
    region: frankfurt
    plan: basic-256mb
    # لا `ipAllowList` ⇒ لا وصول من خارج شبكة Render الداخلية
    ipAllowList: []

services:
  # ---------- الـAPI: خدمة خاصّة، بلا عنوان عام ----------
  - type: pserv
    name: tender-api
    runtime: image
    region: frankfurt
    plan: starter
    image:
      url: ghcr.io/fares-code0/tender-api:v2.2.0
      creds:
        fromRegistryCreds:
          name: ghcr

    # الهجرات **قبل** أن تستقبل النسخة الجديدة أي طلب، وفشلها يوقف النشر
    # فتبقى النسخة العاملة كما هي. نفس ترتيب خدمة `migrate` في compose:
    # خطوة نشر لمرة واحدة، لا عند إقلاع كل نسخة.
    preDeployCommand: ./node_modules/.bin/prisma migrate deploy --schema ./prisma/schema.prisma

    envVars:
      # عنوان القاعدة تحقنه Render من قاعدة البيانات أعلاه — لا يُكتب يدويًا
      - key: DATABASE_URL
        fromDatabase:
          name: tender-db
          property: connectionString

      # H0.1 — سرّ عشوائي تولّده Render مرة واحدة وتحفظه. لا يمرّ بمستودع
      # ولا بمحادثة ولا يراه أحد.
      - key: JWT_SECRET
        generateValue: true

      - key: NODE_ENV
        value: production
      - key: PORT
        value: '4000'

      # H0.2 / S3 — **قفزتان** لا واحدة: حافة Render ثم Caddy. كل واحدة
      # تُلحِق عنوانًا بـ`X-Forwarded-For`، فتصل السلسلة `<العميل>, <الحافة>`
      # ويعدّ Express من اليمين بهذا المقدار. بقيمة `1` كان `req.ip` يساوي
      # عنوان حافة Render لكل الزوار: دلو واحد لتحديد المعدل للمنظومة كلها،
      # وخمس محاولات دخول فاشلة من أي شخص تحجب الدخول عن الجميع.
      # ⚠️ خاصّ بـRender: في `docker-compose.prod.yml` يبقى `1` — Caddy هناك
      # هو القفزة الوحيدة، ورفعه إلى 2 يجعل الترويسة قابلة للتزوير.
      - key: TRUST_PROXY
        value: '2'

      # أصل الواجهة = أصل التطبيق نفسه (أصل واحد). Render لا تركّب مخطَّطًا
      # مع اسم المضيف، فتُضبط يدويًا بعد أول نشر:
      #   https://tender-web.onrender.com  (أو نطاقك المخصّص)
      - key: WEB_ORIGIN
        sync: false

      # H2.2 / H2.3
      - key: RATE_LIMIT_WINDOW_MS
        value: '900000'
      - key: RATE_LIMIT_MAX
        value: '300'
      - key: LOGIN_MAX_FAILED_ATTEMPTS
        value: '5'
      - key: LOGIN_LOCK_MINUTES
        value: '15'

      - key: LOG_LEVEL
        value: info

      # H4.4 — نسخة واحدة، فحدّ اتصالات متحفّظ يكفي
      - key: DB_CONNECTION_LIMIT
        value: '10'
      - key: DB_POOL_TIMEOUT
        value: '10'

      # H6.4 — لا تُكشف صفحة التوثيق على نطاق عام
      - key: DOCS_ENABLED
        value: 'false'

  # ---------- الواجهة والبروكسي: الخدمة العامّة الوحيدة ----------
  - type: web
    name: tender-web
    runtime: image
    region: frankfurt
    plan: starter
    image:
      url: ghcr.io/fares-code0/tender-web:v2.2.0
      creds:
        fromRegistryCreds:
          name: ghcr

    # Render يفحص هذا المسار؛ `/` يخدم الواجهة الثابتة بلا لمس القاعدة
    healthCheckPath: /

    envVars:
      # عنوان بلا اسم مضيف ⇒ HTTP عاديّ بلا شهادة: Render ينهي TLS عند
      # حافته. راجع جدول السلوك في `deploy/Caddyfile`.
      - key: SITE_ADDRESS
        value: ':10000'
      - key: PORT
        value: '10000'

      # وجهة البروكسي: مضيف الخدمة الخاصّة ومنفذها من شبكة Render الداخلية.
      # الـAPI يبقى بلا عنوان عام — الأصل الواحد محفوظ.
      - key: API_UPSTREAM
        fromService:
          name: tender-api
          type: pserv
          property: hostport

      # فحص الحاوية الداخلي يتبع منفذ Render ومخطَّطه لا العنوان المحلي
      - key: HEALTHCHECK_URL
        value: http://127.0.0.1:10000/
